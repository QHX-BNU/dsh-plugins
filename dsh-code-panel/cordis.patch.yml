# dsh-code-panel —— profile 启用配置示例
# 把下面内容追加到 profile 目录（如 C:\Users\<你>\.dsh\profiles\desktop）的 cordis.patch.yml
- insert:
    - id: dsh-code-panel
      name: 'dsh-code-panel'
      config:
        snippetsDir: 'C:/Users/<你>/.dsh/profiles/desktop/data/code-panel/snippets'
        maxFileBytes: 1048576
        webApi: true
