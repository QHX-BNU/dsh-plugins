# dsh-scheduled-tasks —— profile 启用配置示例
# 把下面内容追加到 profile 目录（如 C:\Users\<你>\.dsh\profiles\desktop）的 cordis.patch.yml
- insert:
    - id: dsh-scheduled-tasks
      name: 'dsh-scheduled-tasks'
      config:
        tasksPath: 'C:/Users/<你>/.dsh/profiles/desktop/data/scheduled-tasks.json'
        commandTimeoutMs: 120000
        webApi: true
