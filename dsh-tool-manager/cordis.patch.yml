# dsh-tool-manager —— profile 启用配置示例
# 把下面内容追加到 profile 目录（如 C:\Users\<你>\.dsh\profiles\desktop）的 cordis.patch.yml
- insert:
    - id: dsh-tool-manager
      name: 'dsh-tool-manager'
      config:
        statePath: 'C:/Users/<你>/.dsh/profiles/desktop/data/tool-manager.json'
        runTimeoutMs: 30000
        tools: true
        promptSection: true
        webApi: true
